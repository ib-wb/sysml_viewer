[package]
name = "sysml-viewer"
version = "0.6.0"
description = "SysML v2 Viewer – Desktop-App: Navigator und Diagramme für SysML-v2-Textmodelle"
authors = ["Wolfgang Becker <ib-wb.de>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sysml_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-mini = "0.4"
base64 = "0.22"
dunce = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
