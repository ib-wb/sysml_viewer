# Baut die Desktop-App (Rust/Tauri) für Windows, macOS und Linux.
# Ergebnis: Installer als Artefakte des Laufs (Actions → Lauf → Artifacts).
name: Desktop-App bauen

on:
  push:
    branches: [feature/tauri-app]
    tags: ['v*']
    paths: ['desktop/**', 'src/**', 'beispiel/**', 'tools/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Linux-Bibliotheken für das Fenster
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Viewer bauen (Oberfläche der App)
        run: |
          npm ci
          python tools/build.py

      - name: Tests des Viewers
        if: runner.os == 'Linux'
        run: npm test

      - name: Tests des Rust-Teils
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: App und Installer bauen
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build

      - uses: actions/upload-artifact@v4
        with:
          name: sysml-viewer-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
